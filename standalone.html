<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <meta name="description" content="Own the Room Lab — a local-first public speaking practice dashboard." />
  <title>Own the Room Lab</title>
  <style>
:root {
  --bg: #f6f8f7;
  --panel: #ffffff;
  --panel-soft: #eef7f5;
  --text: #17211f;
  --muted: #68736f;
  --border: #dfe7e4;
  --teal: #0f766e;
  --teal-2: #14b8a6;
  --blue: #2563eb;
  --amber: #d97706;
  --red: #b91c1c;
  --shadow: 0 14px 36px rgba(16, 41, 37, .07);
  --radius: 20px;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--text); background: var(--bg); }
button, input, textarea, select { font: inherit; }
button { cursor: pointer; }
a { color: inherit; }
#app-shell { min-height: 100vh; }
.sidebar { position: fixed; inset: 0 auto 0 0; width: 260px; background: #102b28; color: white; padding: 26px 18px; display: flex; flex-direction: column; z-index: 20; }
.brand { display: flex; gap: 12px; align-items: center; margin-bottom: 28px; padding: 0 8px; }
.brand-mark { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 14px; background: #d9fffa; color: #0b5e57; font-weight: 800; letter-spacing: -.04em; }
.brand strong { display: block; font-size: 15px; }
.brand span { display: block; color: #9fc2bd; font-size: 12px; margin-top: 3px; }
.nav-list { display: grid; gap: 5px; }
.nav-btn { width: 100%; display: flex; gap: 10px; align-items: center; border: 0; color: #bdd1ce; background: transparent; padding: 11px 12px; border-radius: 12px; text-align: left; font-size: 14px; }
.nav-btn:hover, .nav-btn.active { background: rgba(255,255,255,.09); color: white; }
.nav-icon { width: 23px; height: 23px; border-radius: 8px; background: rgba(255,255,255,.08); display: grid; place-items: center; font-size: 12px; }
.sidebar-note { margin-top: auto; border: 1px solid rgba(255,255,255,.12); padding: 13px; border-radius: 14px; display: grid; gap: 5px; }
.sidebar-note strong { font-size: 12px; }
.sidebar-note span { color: #a9c1bd; font-size: 11px; line-height: 1.45; }
.main { margin-left: 260px; min-height: 100vh; }
.topbar { position: sticky; top: 0; z-index: 10; backdrop-filter: blur(16px); background: rgba(246,248,247,.86); padding: 24px 34px 17px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(223,231,228,.8); }
.topbar h1 { margin: 2px 0 0; font-size: clamp(24px, 3vw, 34px); letter-spacing: -.035em; }
.eyebrow { color: var(--teal); font-weight: 800; font-size: 10px; letter-spacing: .18em; }
.topbar-actions { display: flex; gap: 9px; }
.view { padding: 26px 34px 80px; max-width: 1500px; margin: 0 auto; }
.btn { border: 1px solid var(--border); border-radius: 11px; padding: 10px 14px; background: white; color: var(--text); font-weight: 700; font-size: 13px; }
.btn:hover { transform: translateY(-1px); }
.btn-primary { background: var(--teal); border-color: var(--teal); color: white; }
.btn-danger { background: #fff0f0; color: var(--red); border-color: #f6cccc; }
.btn-ghost { background: rgba(255,255,255,.7); }
.btn-small { padding: 7px 10px; font-size: 12px; }
.grid { display: grid; gap: 18px; }
.grid-2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
.grid-3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
.grid-4 { grid-template-columns: repeat(4, minmax(0,1fr)); }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); }
.card-soft { background: var(--panel-soft); border-color: #d5ebe6; }
.card h2, .card h3 { margin: 0; letter-spacing: -.025em; }
.card h2 { font-size: 20px; }
.card h3 { font-size: 16px; }
.card p { color: var(--muted); line-height: 1.58; }
.section-title { display: flex; justify-content: space-between; align-items: end; gap: 12px; margin: 28px 0 12px; }
.section-title h2 { margin: 0; font-size: 20px; letter-spacing: -.025em; }
.section-title p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
.kpi { min-height: 118px; }
.kpi .label { color: var(--muted); font-size: 12px; font-weight: 700; }
.kpi .value { font-size: 31px; font-weight: 850; margin-top: 9px; letter-spacing: -.04em; }
.kpi .hint { color: var(--muted); font-size: 12px; margin-top: 6px; }
.focus-card { display: grid; grid-template-columns: 1.4fr .6fr; gap: 18px; align-items: stretch; }
.focus-main { padding: 25px; border-radius: 18px; background: linear-gradient(135deg, #0b5e57, #103b37); color: white; }
.focus-main p { color: #cbe9e5; }
.focus-label { color: #9fe8dc; font-weight: 800; letter-spacing: .12em; font-size: 10px; }
.focus-main h2 { font-size: clamp(24px, 4vw, 40px); line-height: 1.05; margin: 8px 0 14px; max-width: 650px; }
.target-box { border: 1px solid rgba(255,255,255,.18); border-radius: 14px; padding: 13px; margin-top: 18px; display: flex; justify-content: space-between; gap: 15px; align-items: center; }
.target-box span { font-size: 13px; color: #d9eeeb; }
.target-box strong { font-size: 14px; }
.skill-list { display: grid; gap: 14px; margin-top: 18px; }
.skill-row { display: grid; grid-template-columns: 130px 1fr 42px; gap: 10px; align-items: center; font-size: 12px; }
.skill-bar { height: 8px; background: #edf1ef; border-radius: 100px; overflow: hidden; }
.skill-fill { height: 100%; background: var(--teal-2); border-radius: inherit; }
.skill-value { text-align: right; font-weight: 800; }
.quick-grid { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 10px; }
.quick-btn { border: 1px solid var(--border); background: white; border-radius: 14px; padding: 14px; text-align: left; }
.quick-btn strong { display: block; margin-bottom: 4px; }
.quick-btn span { font-size: 11px; color: var(--muted); }
.chart-wrap { width: 100%; overflow: hidden; }
.chart { width: 100%; height: 220px; }
.chart .grid-line { stroke: #e7eeeb; stroke-width: 1; }
.chart .line { fill: none; stroke: var(--teal); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.chart .area { fill: rgba(20,184,166,.10); }
.chart text { font-size: 10px; fill: #7c8783; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th, td { padding: 12px 10px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
th { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .08em; }
.badge { display: inline-flex; align-items: center; padding: 5px 8px; border-radius: 999px; background: #edf7f5; color: #0f766e; font-size: 10px; font-weight: 800; }
.badge-warn { background: #fff7e8; color: #9a5a00; }
.badge-red { background: #fff0f0; color: #a21d1d; }
.field { display: grid; gap: 7px; }
.field label { font-size: 12px; font-weight: 750; }
.input, textarea, select { width: 100%; border: 1px solid var(--border); background: white; border-radius: 11px; padding: 11px 12px; color: var(--text); outline: none; }
.input:focus, textarea:focus, select:focus { border-color: #84cfc5; box-shadow: 0 0 0 3px rgba(20,184,166,.08); }
textarea { min-height: 120px; resize: vertical; }
.record-shell { display: grid; grid-template-columns: 1.15fr .85fr; gap: 18px; }
.video-frame { aspect-ratio: 16/9; background: #12221f; border-radius: 18px; overflow: hidden; display: grid; place-items: center; color: #c0d4d0; position: relative; }
.video-frame video { width: 100%; height: 100%; object-fit: cover; }
.timer { position: absolute; top: 14px; left: 14px; background: rgba(0,0,0,.55); color: white; border-radius: 999px; padding: 7px 10px; font-weight: 800; font-variant-numeric: tabular-nums; }
.record-controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.record-dot { display: inline-block; width: 9px; height: 9px; background: #e11d48; border-radius: 50%; margin-right: 6px; }
.metric-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; }
.metric { padding: 13px; border: 1px solid var(--border); border-radius: 14px; }
.metric .metric-label { color: var(--muted); font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; }
.metric strong { display: block; font-size: 23px; margin-top: 5px; }
.highlight-box { line-height: 1.8; background: #fbfcfc; border: 1px solid var(--border); border-radius: 14px; padding: 16px; min-height: 110px; }
.hl-filler { background: #ffe1e7; border-radius: 4px; padding: 1px 3px; }
.hl-hedge { background: #fff0c7; border-radius: 4px; padding: 1px 3px; }
.hl-evidence { background: #daf5eb; border-radius: 4px; padding: 1px 3px; }
.hl-qualifier { background: #dbeafe; border-radius: 4px; padding: 1px 3px; }
.hl-absolute { background: #ffd7d7; color: #8f1111; border-radius: 4px; padding: 1px 3px; font-weight: 800; }
.review-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.score-list { display: grid; gap: 11px; margin-top: 14px; }
.score-row { display: grid; grid-template-columns: 1fr 140px 30px; gap: 10px; align-items: center; font-size: 12px; }
.range { width: 100%; accent-color: var(--teal); }
.lesson { border: 1px solid var(--border); background: white; border-radius: 16px; padding: 15px; display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: start; }
.lesson.done { background: #f2faf8; border-color: #cce9e3; }
.lesson input[type=checkbox] { width: 19px; height: 19px; accent-color: var(--teal); margin-top: 2px; }
.lesson-title { font-weight: 850; font-size: 14px; }
.lesson-meta { color: var(--muted); font-size: 11px; margin-top: 4px; }
.lesson-body { grid-column: 2 / -1; background: #fafcfc; border-radius: 12px; padding: 12px; font-size: 12px; color: #48534f; line-height: 1.55; }
.topic-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
.topic { padding: 16px; border: 1px solid var(--border); border-radius: 16px; background: white; }
.topic .category { color: var(--teal); text-transform: uppercase; letter-spacing: .08em; font-size: 9px; font-weight: 850; }
.topic h3 { margin: 7px 0 8px; font-size: 15px; }
.topic p { margin: 0; font-size: 12px; color: var(--muted); }
.topic .actions { margin-top: 13px; display: flex; gap: 8px; }
.progress-ring { width: 95px; height: 95px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--teal) var(--pct), #e8eeec 0); position: relative; }
.progress-ring::before { content: ''; position: absolute; width: 72px; height: 72px; border-radius: 50%; background: white; }
.progress-ring strong { position: relative; font-size: 20px; }
.settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.note { padding: 12px 14px; border-radius: 12px; background: #fff8e8; border: 1px solid #f3dfb3; color: #75521a; font-size: 12px; line-height: 1.5; }
.empty { text-align: center; padding: 35px 20px; color: var(--muted); }
.dialog { border: 0; border-radius: 18px; padding: 0; width: min(430px, calc(100vw - 30px)); box-shadow: 0 30px 90px rgba(0,0,0,.25); }
.dialog::backdrop { background: rgba(10,20,18,.45); backdrop-filter: blur(3px); }
.dialog form { padding: 22px; }
.dialog h3 { margin: 0 0 8px; }
.dialog p { color: var(--muted); line-height: 1.5; }
.dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
.mobile-nav { display: none; }
@media (max-width: 1100px) { .grid-4 { grid-template-columns: repeat(2, 1fr); } .quick-grid { grid-template-columns: repeat(3,1fr); } .record-shell { grid-template-columns: 1fr; } }
@media (max-width: 820px) {
  .sidebar { display: none; }
  .main { margin-left: 0; padding-bottom: 72px; }
  .topbar { padding: 18px 18px 13px; }
  .topbar-actions .btn-ghost { display: none; }
  .view { padding: 18px 16px 90px; }
  .mobile-nav { position: fixed; display: grid; grid-template-columns: repeat(5,1fr); bottom: 0; left: 0; right: 0; z-index: 30; padding: 8px max(8px, env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left)); background: rgba(255,255,255,.96); backdrop-filter: blur(14px); border-top: 1px solid var(--border); }
  .mobile-nav .nav-btn { color: #65716d; padding: 8px 4px; font-size: 10px; display: grid; justify-items: center; gap: 3px; text-align: center; }
  .mobile-nav .nav-btn.active { color: var(--teal); background: #edf7f5; }
  .mobile-nav .nav-icon { background: transparent; font-size: 14px; }
  .focus-card, .grid-2, .grid-3, .settings-grid, .review-columns { grid-template-columns: 1fr; }
  .quick-grid { grid-template-columns: repeat(2, 1fr); }
  .topic-grid { grid-template-columns: 1fr; }
  .metric-grid { grid-template-columns: repeat(2,1fr); }
  .score-row { grid-template-columns: 1fr 110px 28px; }
}
@media (max-width: 480px) {
  .grid-4 { grid-template-columns: 1fr 1fr; }
  .card { padding: 16px; border-radius: 16px; }
  .topbar h1 { font-size: 25px; }
  .topbar-actions .btn-primary { padding: 9px 10px; font-size: 12px; }
  .quick-grid { grid-template-columns: 1fr; }
  .metric-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .skill-row { grid-template-columns: 105px 1fr 35px; }
}

</style>
</head>
<body>
  <div id="app-shell">
    <aside class="sidebar" aria-label="Primary navigation">
      <div class="brand">
        <div class="brand-mark">OR</div>
        <div><strong>Own the Room Lab</strong><span>Speaking performance</span></div>
      </div>
      <nav id="desktop-nav"></nav>
      <div class="sidebar-note">
        <strong>Local-first by default</strong>
        <span>Your recordings stay in this browser unless you export them.</span>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <div class="eyebrow">PUBLIC SPEAKING PERFORMANCE LAB</div>
          <h1 id="page-title">Dashboard</h1>
        </div>
        <div class="topbar-actions">
          <button id="demo-toggle" class="btn btn-ghost" type="button">Demo data: On</button>
          <button class="btn btn-primary" data-nav="practice" type="button">Start practice</button>
        </div>
      </header>

      <section id="view" class="view" aria-live="polite"></section>
    </main>

    <nav id="mobile-nav" class="mobile-nav" aria-label="Mobile navigation"></nav>
  </div>

  <dialog id="confirm-dialog" class="dialog">
    <form method="dialog">
      <h3 id="confirm-title">Confirm</h3>
      <p id="confirm-body"></p>
      <div class="dialog-actions">
        <button value="cancel" class="btn btn-ghost">Cancel</button>
        <button value="confirm" class="btn btn-danger">Confirm</button>
      </div>
    </form>
  </dialog>

  <script type="module">
const APP_VERSION = 1;
const STORAGE_KEY = `ownTheRoomLab:v${APP_VERSION}`;
const MEDIA_DB = 'ownTheRoomLabMedia';

const navItems = [
  ['dashboard', 'Dashboard', 'D'],
  ['practice', 'Practice', 'P'],
  ['review', 'Review', 'R'],
  ['course', 'Course', 'C'],
  ['topics', 'Topics', 'T'],
  ['progress', 'Progress', '↗'],
  ['settings', 'Settings', '⚙']
];

const mobileItems = navItems.filter(([id]) => ['dashboard','practice','course','topics','progress'].includes(id));

const lessons = [
  ['Students\' 30 Second Speeches','9:22','Deliver one clear idea under time pressure.','30-second intro: who you are, what you care about, and why evidence-led wellness matters.','Finish in 25–35 seconds without rushing.'],
  ['Communication Exercises','18:13','Warm up articulation, attention and audience connection.','Explain “what is a peptide?” three ways: consumer, clinician, and investor.','Use three distinct versions without reading.'],
  ['Brain Works: Rewire, Refind, Reconnect','24:09','Practice deliberately enough to build new speaking habits.','Repeat the same 60-second mechanism explanation twice and change one delivery habit.','Improve one chosen metric on attempt B.'],
  ['Mirror Neurons','35:15','Use observable energy and presence to help the audience engage.','Explain a wellness concept with intentional posture and facial animation.','Self-rate physical presence 4/5 or better.'],
  ['Be Memorable: Paint Pictures, Evoke Emotions','42:40','Turn abstract information into images people can remember.','Describe appetite signaling without jargon using one vivid analogy.','Use one concrete image and one emotional consequence.'],
  ['Using Strong Language','27:05','Replace weak, vague phrasing with concise language.','Explain a complex wellness concept in plain English with no jargon.','Cut hedging phrases by 30% on the second attempt.'],
  ['Voice Modulation','52:32','Use pace, pitch, volume and pauses intentionally.','Explain the same mechanism twice: neutral, then with planned emphasis and pauses.','Use at least two deliberate one-second pauses.'],
  ['Body Language','26:15','Make gesture, posture and movement support the message.','Give a 90-second standing explanation of receptor activity.','Keep gestures purposeful; self-rate naturalness 4/5+.'],
  ['Power of Stories','29:41','Use narrative structure to make information meaningful.','Turn a dry evidence summary into a 90-second audience-safe story without medical promises.','Include setup, tension, insight, takeaway.'],
  ['Dial Testing Student Stories','38:56','Notice where attention rises or drops.','Mark the strongest and weakest 15 seconds of your latest recording.','Identify one exact moment to rewrite.'],
  ['Involve the Audience','45:04','Make the audience active participants.','Open a wellness talk with a question that gets a show of hands or mental response.','Ask one audience-relevant question in the first 20 seconds.'],
  ['Body Poll Exercises','31:29','Use simple audience interaction to create energy.','Create three safe audience polls about wellness literacy, not personal health status.','Use one poll without putting anyone on the spot.'],
  ['Handling Distracted Audiences','25:25','Recover attention without showing frustration.','Practice a reset line after an imagined interruption.','Regain your main point within 10 seconds.'],
  ['Using Names','17:27','Personalize interaction naturally.','Practice answering a question while using the questioner’s name once.','Use the name naturally, not repetitively.'],
  ['Team Presentations','23:11','Hand off cleanly and support a shared message.','Practice a 20-second handoff from a science explanation to a commercial colleague.','State why the next speaker matters.'],
  ['Active Listening','42:21','Listen for intent before answering.','Answer a skeptical peptide question by first restating the concern.','Reflect the concern in one sentence before responding.'],
  ['Reading the Audience','14:05','Adjust complexity and pace based on audience signals.','Explain the same topic to a beginner, then to a clinician.','Change vocabulary and depth without changing core facts.'],
  ['Think, Edit, Speak','30:00','Organize the thought before filling the silence.','Take a difficult Q&A prompt, pause two seconds, then answer in three points.','No filler word in the first sentence.'],
  ['Imagine Your Opening','39:11','Start with tension, relevance or curiosity.','Create three openings for a talk on evidence-led wellness.','No biography in the first 20 seconds.'],
  ['Dial Test/Rating on Student Stories','38:40','Use feedback to refine story moments.','Rate each 15-second segment of a 2-minute talk from 1–5 for engagement.','Rewrite the lowest-rated segment.'],
  ['Students Present What They Have Learned','11:15','Integrate multiple skills in one performance.','Give a 2-minute talk using one story, one pause, one audience question and one strong close.','Hit all four elements.'],
  ['Close with Action','44:10','End with a clear next step rather than fading out.','Close a wellness education talk with one responsible action the audience can take.','Final sentence must be specific and memorable.'],
  ['Putting the Pieces Together','22:13','Combine content, delivery and audience connection.','Deliver a 3-minute mini-talk with opening, evidence, story, implication and close.','Stay within ±15 seconds of target.'],
  ['Map Out Better Meetings','17:20','Give meetings an outcome and a clear structure.','Open a 10-minute evidence review meeting and define the decision needed.','State desired outcome in the first 30 seconds.'],
  ['Power of Recognition','37:33','Use specific recognition to build connection.','Thank a collaborator for a concrete contribution in 20 seconds.','Name behavior + impact, not generic praise.'],
  ['Q & A','10:28','Answer directly, accurately and without defensiveness.','Answer “Is this safe?” without overpromising or hiding uncertainty.','Answer first, explain second, qualify where needed.'],
  ['Elevator Pitch','28:47','Compress value into a clear, relevant pitch.','Give a 45-second pitch for evidence-led wellness education.','Problem → approach → why it matters → next step.'],
  ['Dial Testing on Student Pitches','52:51','Refine the moments that lose attention.','Record your pitch twice and compare the first 15 seconds.','Improve clarity without adding length.'],
  ['Motivational Speaking','24:37','Move people through meaning, not hype.','Motivate an audience to become more evidence-literate about wellness claims.','Use aspiration without exaggerated promises.'],
  ['The 2 Minute Talk','33:03','Deliver a complete idea inside a tight time box.','2 minutes: “How should we think about peptide evidence responsibly?”','Finish between 1:50 and 2:10.'],
  ['Improve Yourself Now','13:33','Turn feedback into a repeatable practice loop.','Re-record your Day 0 baseline prompt after completing the course.','Compare baseline vs latest on the same metrics.']
];

const topics = [
  ['Explain Simply','Explain what a peptide is to a non-scientist','Avoid chemistry jargon. Use one analogy and one limitation.'],
  ['Explain Simply','Explain GLP-1 vs GIP vs glucagon receptor activity','Make the three roles memorable without implying that mechanism guarantees outcomes.'],
  ['Explain Simply','Explain what “half-life” means without jargon','Use a real-world time analogy, then state why half-life alone does not define dosing.'],
  ['Explain Simply','Explain why mechanism does not equal proven clinical benefit','Separate biological plausibility from clinical evidence.'],
  ['Evidence & Credibility','Explain animal vs early-human vs phase 3 evidence','Help a non-scientist understand what each level can and cannot establish.'],
  ['Evidence & Credibility','Critique a social-media “cycle length” graphic responsibly','Explain why a neat duration graphic may overstate certainty or blur approved and experimental use.'],
  ['Evidence & Credibility','Research peptide vs approved medicine','Explain why these terms are not interchangeable and why regulatory context matters.'],
  ['Evidence & Credibility','Explain uncertainty without sounding weak','Use precise qualifiers while keeping a strong, clear sentence structure.'],
  ['Evidence & Credibility','How to say “we do not know yet” credibly','Give an answer that is transparent, useful and not evasive.'],
  ['Evidence & Credibility','Spot an overclaim and repair it','Turn “this always works” into a defensible evidence-based statement.'],
  ['Peptide & Wellness','Retatrutide: what makes a triple receptor agonist different?','Explain the mechanism at a high level and distinguish trial evidence from approval status.'],
  ['Peptide & Wellness','MOTS-C and mitochondrial biology: known vs speculative','Practice a clean boundary between mechanistic interest and established human outcomes.'],
  ['Peptide & Wellness','BPC-157: popular claims vs human evidence','Communicate uncertainty without becoming dismissive.'],
  ['Peptide & Wellness','Tesamorelin: approved indications vs broader wellness discussion','Practice keeping indication, off-label discussion and evidence strength distinct.'],
  ['Peptide & Wellness','Peptides and body composition','Explain which outcomes require real clinical evidence rather than before/after anecdotes.'],
  ['Peptide & Wellness','Why side effects and contraindications belong in good health communication','Frame risk discussion as a trust-building part of responsible education.'],
  ['Protocol Thinking','What makes a wellness protocol evidence-led?','Discuss goals, baseline measurements, evidence quality, monitoring and stop criteria without prescribing a dose.'],
  ['Protocol Thinking','How to explain protocol optimization without promising optimization','Focus on measurement, feedback loops and uncertainty.'],
  ['Real-world Speaking','30-second founder / educator introduction','Who are you, what do you work on, and why should this audience care?'],
  ['Real-world Speaking','60-second answer: “Why should I trust what you’re saying?”','Use transparent sourcing, limits and practical relevance.'],
  ['Real-world Speaking','2-minute conference opener on evidence-led wellness','Start with tension, avoid hype, land one clear thesis.'],

function openMediaDB(){

}
async function saveMedia(id,blob){ if(!blob) return; const db=await openMediaDB(); const tx=db.transaction('recordings','readwrite'); tx.objectStore('recordings').put(blob,id); return new Promise(r=>tx.oncomplete=r); }

function analyzeTranscript(text,durationSec){
  const clean=text.trim();
  const words=(clean.match(/\b[\w’'-]+\b/g)||[]).map(w=>w.toLowerCase());
  const sentences=clean.split(/[.!?]+/).map(s=>s.trim()).filter(Boolean);
  const settingsFillers=state.settings.fillers.split(',').map(s=>s.trim().toLowerCase()).filter(Boolean);
  const hay=` ${clean.toLowerCase()} `;
  const countPhrase=p=> (hay.match(new RegExp(`\\b${p.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/\s+/g,'\\s+')}\\b`,'g'))||[]).length;
  const fillerCount=settingsFillers.reduce((a,p)=>a+countPhrase(p),0);
  const hedgeList=['i think','maybe','perhaps','probably','just','sort of','kind of'];
  const evidenceList=['study','studies','trial','trials','data','evidence','published','according to','randomized','phase 2','phase 3'];
  const qualifierList=['may','might','suggests','suggest','preliminary','uncertain','uncertainty','not yet established','limited evidence','associated with'];
  const absoluteList=['always','guaranteed','guarantee','cure','zero risk','works for everyone','completely safe','no side effects'];
  const strongList=['recommend','decide','measure','compare','verify','test','focus','start','stop','act','choose','build','explain'];
  const counts = list => list.reduce((a,p)=>a+countPhrase(p),0);
  const freq=new Map(); words.forEach(w=>freq.set(w,(freq.get(w)||0)+1));
  const repeats=[...freq.entries()].filter(([w,n])=>n>=3 && w.length>4).length;
  const durationMin=Math.max(durationSec/60, .01);
  const avgSentence=sentences.length ? words.length/sentences.length : words.length;
  return {
    words:words.length,
    wpm:Math.round(words.length/durationMin),
    fillerCount,
    fillerRate:words.length?+(fillerCount/words.length*100).toFixed(1):0,
    hedges:counts(hedgeList), evidence:counts(evidenceList), qualifiers:counts(qualifierList), absolutes:counts(absoluteList),
    questions:(clean.match(/\?/g)||[]).length,
    audienceRefs:words.filter(w=>w==='you'||w==='we'||w==='your'||w==='our').length,
    avgSentence:+avgSentence.toFixed(1), longSentences:sentences.filter(s=>(s.match(/\b[\w’'-]+\b/g)||[]).length>25).length,
    repeats,strongWords:counts(strongList)
  };
}

function indicatorScores(session){
  const m=session.metrics||analyzeTranscript(session.transcript||'',session.durationSec||120);
  const r=session.ratings||[3,3,3,3,3,3,3,3];
  const {minWpm,maxWpm}=state.settings;
  const pace = m.wpm>=minWpm && m.wpm<=maxWpm ? 88 : clamp(88-Math.min(Math.abs(m.wpm-minWpm),Math.abs(m.wpm-maxWpm))*1.4,40,88);
  const clarity=clamp(96-m.fillerRate*8-Math.max(0,m.avgSentence-20)*1.8-m.hedges*1.3,35,98);
  const vocal=clamp(r[3]*20,20,100);
  const physical=clamp(r[4]*20,20,100);
  const structure=clamp(((r[5]+r[6])/2)*20,20,100);
  const credibility=clamp(62+m.evidence*6+m.qualifiers*4+m.audienceRefs*.6-m.absolutes*14,30,100);
  return {Clarity:Math.round(clarity),'Pace & Pauses':Math.round((pace+r[2]*20)/2),'Vocal Variety':Math.round(vocal),'Physical Presence':Math.round(physical),'Story & Structure':Math.round(structure),Credibility:Math.round(credibility)};
}

function highlightTranscript(text=''){
  let escaped=escapeHtml(text);
  const groups=[
    ['hl-absolute',['works for everyone','completely safe','no side effects','zero risk','guaranteed','guarantee','always','cure']],
    ['hl-evidence',['according to','randomized','phase 3','phase 2','published','evidence','studies','study','trials','trial','data']],
    ['hl-qualifier',['not yet established','limited evidence','uncertainty','uncertain','preliminary','suggests','suggest','might','may']],
    ['hl-hedge',['i think','probably','perhaps','maybe','kind of','sort of','just']],
    ['hl-filler',state.settings.fillers.split(',').map(x=>x.trim()).filter(Boolean)]
  ];
  for(const [cls,phrases] of groups){
    for(const phrase of phrases.sort((a,b)=>b.length-a.length)){
      const re=new RegExp(`\\b(${phrase.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/\s+/g,'\\s+')})\\b`,'gi');
      escaped=escaped.replace(re,`<span class="${cls}">$1</span>`);
    }
  }
  return escaped || '<span style="color:#87908d">No transcript yet.</span>';
}

function kpi(label,value,hint){ return `<div class="card kpi"><div class="label">${label}</div><div class="value">${value}</div><div class="hint">${hint}</div></div>`; }
function quick(label,time,drill,duration){ return `<button class="quick-btn" data-quick="${drill}" data-duration="${duration}"><strong>${label}</strong><span>${time} target</span></button>`; }
function nextDrill(skill){
  const map={
    'Clarity':'Repeat one 60-second explanation. Cut filler words and sentences over 25 words. Keep the content identical so you isolate clarity.',
    'Pace & Pauses':'Give a 90-second explanation with two planned one-second pauses: after the opening claim and before the takeaway.',
    'Vocal Variety':'Repeat one paragraph three times, changing only emphasis, pace and volume. Then deliver the full 60-second version.',
    'Physical Presence':'Stand, frame the camera waist-up, keep shoulders open, and use only gestures that underline a specific word or contrast.',
    'Story & Structure':'Use: situation → tension → evidence/insight → implication → action. Keep it to 90 seconds.',
    'Credibility':'Answer a skeptical question with one evidence reference, one explicit limit, and no absolute claim.'
  }; return map[skill]||map.Clarity;
}

function lineChart(points){
  if(!points.length) return `<div class="empty">Record a session to build your trend.</div>`;
  const w=900,h=220,p=25; const vals=points.map(x=>x.value); const min=Math.min(40,...vals)-5,max=Math.max(100,...vals)+2;
  const xy=points.map((d,i)=>({x:p+(i*(w-p*2)/(Math.max(points.length-1,1))),y:h-p-((d.value-min)/(max-min))*(h-p*2),...d}));
  const path=xy.map((q,i)=>`${i?'L':'M'}${q.x.toFixed(1)},${q.y.toFixed(1)}`).join(' ');
  const area=`${path} L${xy.at(-1).x},${h-p} L${xy[0].x},${h-p} Z`;
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Performance trend chart">
    ${[0,1,2,3].map(i=>`<line class="grid-line" x1="${p}" x2="${w-p}" y1="${p+i*(h-p*2)/3}" y2="${p+i*(h-p*2)/3}"/>`).join('')}
    <path class="area" d="${area}"/><path class="line" d="${path}"/>
    ${xy.map(q=>`<circle cx="${q.x}" cy="${q.y}" r="4" fill="#0f766e"/><text x="${q.x}" y="${h-5}" text-anchor="middle">${q.date}</text>`).join('')}
  </svg>`;
}

    practice.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:true});

  if(practice.stream) return practice.stream;

    const stream=await ensureAudioStream();
    practice.chunks=[]; practice.blob=null; practice.seconds=0; practice.startedAt=Date.now(); practice.recording=true;
    practice.recorder=new MediaRecorder(stream);
    practice.recorder.ondataavailable=e=>{if(e.data.size) practice.chunks.push(e.data);};
    practice.recorder.onstop=()=>{ practice.blob=new Blob(practice.chunks,{type:practice.recorder.mimeType||'audio/webm'}); document.querySelector('#save-session').disabled=false; document.querySelector('#discard-btn').disabled=false; };
    practice.recorder.start(500);
    document.querySelector('#record-status').textContent='Recording'; document.querySelector('#record-btn').disabled=true; document.querySelector('#stop-btn').disabled=false;
    practice.timerId=setInterval(()=>{ practice.seconds=Math.floor((Date.now()-practice.startedAt)/1000); const el=document.querySelector('#timer'); if(el) el.textContent=fmtDuration(practice.seconds); },250);
    if(('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) && !practice.recognition) startRecognition();
  }catch(err){ alert(`Recording could not start: ${err.message}`); }
}

function stopRecording(){

function discardRecording(){

function startRecognition(){
  const R=window.SpeechRecognition||window.webkitSpeechRecognition; if(!R) return;
  try{
    const r=new R(); r.continuous=true; r.interimResults=true; r.lang='en-US';
    let finalText=document.querySelector('#transcript').value || '';
    r.onresult=e=>{ let interim=''; for(let i=e.resultIndex;i<e.results.length;i++){ const txt=e.results[i][0].transcript; if(e.results[i].isFinal) finalText += `${finalText?' ':''}${txt}`; else interim+=txt; } document.querySelector('#transcript').value=`${finalText}${interim?' '+interim:''}`.trim(); practice.transcript=document.querySelector('#transcript').value; };
    r.onerror=()=>{}; r.onend=()=>{ if(practice.recording){ try{r.start();}catch{} } };
    practice.recognition=r; r.start(); document.querySelector('#speech-btn').textContent='Live transcript on';
  }catch{}
}
function stopRecognition(){ if(practice.recognition){ try{practice.recognition.stop();}catch{} practice.recognition=null; const b=document.querySelector('#speech-btn'); if(b) b.textContent='Start live transcript'; } }
function toggleRecognition(){ if(practice.recognition) stopRecognition(); else startRecognition(); }

function attemptComparison(s){

function recommendations(s){
  const m=s.metrics, strengths=[], improvements=[];
  if(m.wpm>=state.settings.minWpm&&m.wpm<=state.settings.maxWpm) strengths.push('Pace sits inside your chosen target band.'); else improvements.push(`Bring pace toward ${state.settings.minWpm}–${state.settings.maxWpm} WPM.`);
  if(m.fillerRate<2) strengths.push('Low filler-word rate.'); else improvements.push('Replace fillers with a silent pause.');
  if(m.evidence>=2) strengths.push('You used explicit evidence language.'); else improvements.push('Add a concrete evidence reference where the claim depends on data.');
  if(m.qualifiers>=1) strengths.push('You signaled uncertainty where appropriate.'); else improvements.push('Use a precise qualifier when evidence is limited or preliminary.');
  if(m.absolutes===0) strengths.push('No obvious unsupported absolute language was flagged.'); else improvements.push('Rewrite absolute claims into evidence-bounded statements.');
  if(m.avgSentence>22) improvements.push('Shorten long sentences so the listener can process one idea at a time.');
  return [strengths.slice(0,3),improvements.slice(0,3)];
}
function prescription(s){ const m=s.metrics; if(m.fillerRate>=2) return 'Repeat the same talk. Keep the content identical, reduce filler phrases by 30%, and use two deliberate one-second pauses instead.'; if(m.wpm>state.settings.maxWpm) return 'Repeat the same talk 10–15 WPM slower. Pause after the opening claim and immediately before your conclusion.'; if(m.absolutes>0) return 'Repeat the talk and replace each absolute claim with evidence + scope + uncertainty. Keep the language strong, not vague.'; return 'Repeat the same talk once. Keep the content fixed and improve only one thing: a stronger opening and a cleaner final sentence.'; }

function exportCSV(){
  const headers=['id','date','drill','topic','durationSec','transcript','wpm','fillerCount','fillerRate','hedges','evidence','qualifiers','absolutes','questions','audienceRefs','avgSentence','ratings','notes'];
  const esc=v=>`"${String(v??'').replaceAll('"','""')}"`;
  const rows=state.sessions.map(s=>[s.id,s.date,s.drill,s.topic,s.durationSec,s.transcript,s.metrics.wpm,s.metrics.fillerCount,s.metrics.fillerRate,s.metrics.hedges,s.metrics.evidence,s.metrics.qualifiers,s.metrics.absolutes,s.metrics.questions,s.metrics.audienceRefs,s.metrics.avgSentence,(s.ratings||[]).join('|'),s.notes].map(esc).join(','));
  const blob=new Blob([[headers.join(','),...rows].join('\n')],{type:'text/csv'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='own-the-room-sessions.csv'; a.click(); URL.revokeObjectURL(a.href);
}
function parseCSV(text){
  const rows=[]; let row=[],cell='',quoted=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(quoted){ if(ch==='"' && text[i+1]==='"'){cell+='"';i++;} else if(ch==='"'){quoted=false;} else cell+=ch; }
    else if(ch==='"') quoted=true;
    else if(ch===','){row.push(cell);cell='';}
    else if(ch==='\n'){row.push(cell.replace(/\r$/,''));rows.push(row);row=[];cell='';}
    else cell+=ch;
  }
  if(cell.length||row.length){row.push(cell.replace(/\r$/,''));rows.push(row);}
  return rows;
}
function importCSV(e){
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader(); reader.onload=()=>{
    try{
      const rows=parseCSV(reader.result); if(rows.length<2) throw new Error('No session rows found.');
      const headers=rows[0]; const idx=Object.fromEntries(headers.map((h,i)=>[h,i]));
      const required=['id','date','drill','topic','durationSec','transcript','wpm','fillerRate'];
      if(required.some(k=>idx[k]===undefined)) throw new Error('This CSV is not an Own the Room export.');
      const imported=[];
      for(const r of rows.slice(1)){
        if(!r[idx.id]) continue;
        const num=k=>Number(r[idx[k]]||0);
        imported.push({id:r[idx.id],date:r[idx.date],drill:r[idx.drill],topic:r[idx.topic],durationSec:num('durationSec'),transcript:r[idx.transcript]||'',metrics:{words:num('wpm')?Math.round(num('wpm')*num('durationSec')/60):0,wpm:num('wpm'),fillerCount:num('fillerCount'),fillerRate:num('fillerRate'),hedges:num('hedges'),evidence:num('evidence'),qualifiers:num('qualifiers'),absolutes:num('absolutes'),questions:num('questions'),audienceRefs:num('audienceRefs'),avgSentence:num('avgSentence'),longSentences:0,repeats:0,strongWords:0},ratings:(r[idx.ratings]||'').split('|').filter(Boolean).map(Number),notes:r[idx.notes]||''});
      }
      const seen=new Set(state.sessions.map(s=>s.id)); const fresh=imported.filter(s=>!seen.has(s.id)); state.sessions.push(...fresh); saveState(); alert(`Imported ${fresh.length} session${fresh.length===1?'':'s'}. ${imported.length-fresh.length} duplicate${imported.length-fresh.length===1?'':'s'} skipped.`); renderSettings();
    }catch(err){alert(`Import failed: ${err.message}`);}
  }; reader.readAsText(file);
}

function confirmAction(title,body,onConfirm){ const d=document.querySelector('#confirm-dialog'); document.querySelector('#confirm-title').textContent=title; document.querySelector('#confirm-body').textContent=body; d.returnValue=''; d.showModal(); d.addEventListener('close',()=>{if(d.returnValue==='confirm') onConfirm();},{once:true}); }

function baselineStart(){ state.selectedDrill='Baseline'; state.selectedTopic='Who am I, what do I do, and why should someone care?'; state.settings.defaultDuration=120; saveState(); navigate('practice'); }
function startLesson(i){ state.selectedDrill=i===29?'2-min talk':i===26?'Elevator pitch':i===25?'Q&A':'2-min talk'; state.selectedTopic=lessons[i][3]; saveState(); navigate('practice'); }
function startTopic(t){ state.selectedTopic=t; state.selectedDrill='2-min talk'; saveState(); navigate('practice'); }
function rerecord(id){ const s=state.sessions.find(x=>x.id===id); if(!s)return; state.selectedTopic=s.topic; state.selectedDrill=s.drill; state.settings.defaultDuration=s.durationSec; saveState(); navigate('practice'); }

function handleClick(e){
  const nav=e.target.closest('[data-nav]'); if(nav){navigate(nav.dataset.nav);return;}
  const quickEl=e.target.closest('[data-quick]'); if(quickEl){state.selectedDrill=quickEl.dataset.quick;state.settings.defaultDuration=Number(quickEl.dataset.duration);saveState();navigate('practice');return;}
  const baseline=e.target.closest('[data-baseline]'); if(baseline){baselineStart();return;}
  const lp=e.target.closest('[data-lesson-practice]'); if(lp){startLesson(Number(lp.dataset.lessonPractice));return;}
  const tp=e.target.closest('[data-topic]'); if(tp){startTopic(tp.dataset.topic);return;}
  const rv=e.target.closest('[data-review-id]'); if(rv){location.hash=`#/review?id=${rv.dataset.reviewId}`;return;}
  const rr=e.target.closest('[data-rerecord]'); if(rr){rerecord(rr.dataset.rerecord);return;}
  const del=e.target.closest('[data-delete-session]'); if(del){const id=del.dataset.deleteSession;confirmAction('Delete this session','This removes the session record and its locally stored recording from this browser.',async()=>{state.sessions=state.sessions.filter(s=>s.id!==id);if(state.baselineId===id)state.baselineId=null;await deleteMedia(id);saveState();navigate('review');});return;}
}

window.addEventListener('hashchange',render);
document.addEventListener('click',handleClick);
document.querySelector('#demo-toggle').addEventListener('click',()=>{state.demo=!state.demo;saveState();render();});
if(!location.hash) location.hash='#/dashboard'; else render();

</script>

name: Own the Room Lab CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build static dashboard
        run: node build-own-room.cjs
      - name: Verify output
        run: |
          test -s dist/index.html
          grep -q "Own the Room Lab" dist/index.html
